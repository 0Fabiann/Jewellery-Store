# Repository settings for branch protection
repository:
  name: Jewelery-Store
  description: Professional jewelry store with Flask backend and Angular frontend
  private: false
  has_issues: true
  has_projects: true
  has_wiki: false

branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        contexts:
          - "Flask Backend CI"
          - "Angular Frontend CI"
      enforce_admins: true
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      restrictions: null
      allow_force_pushes: false
      allow_deletions: false

  - name: develop
    protection:
      required_status_checks:
        strict: true
        contexts:
          - "Flask Backend CI"
          - "Angular Frontend CI"
      enforce_admins: false
      required_pull_request_reviews: null
      restrictions: null
      allow_force_pushes: false
      allow_deletions: false
